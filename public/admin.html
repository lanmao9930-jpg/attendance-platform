<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>就业服务团值班考勤管理端</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <form class="login-card" id="loginForm">
        <p class="eyebrow">管理端登录</p>
        <h1>就业服务团值班考勤后台</h1>
        <div class="field">
          <label for="adminPassword">管理员口令</label>
          <div class="password-row">
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
            <button class="button secondary password-toggle" id="togglePasswordBtn" type="button" aria-label="显示密码" title="显示密码">显示</button>
          </div>
        </div>
        <div id="loginError" class="notice error hidden"></div>
        <button class="button" id="loginBtn" type="submit">进入后台</button>
      </form>
    </section>

    <div class="app-shell hidden" id="adminApp">
      <aside class="sidebar">
        <div class="brand">
          <strong>值班考勤平台</strong>
          <span>仅管理员可见</span>
        </div>
        <nav class="nav" aria-label="管理端导航">
          <button class="active" data-view="qr">现场二维码</button>
          <button data-view="schedules">固定排班</button>
          <button data-view="review">考勤审核</button>
          <button data-view="records">原始归档</button>
        </nav>
      </aside>

      <main class="main">
        <section class="topbar">
          <div>
            <p class="eyebrow">管理端</p>
            <h1>就业服务团值班考勤</h1>
          </div>
          <div class="toolbar">
            <a class="button secondary" href="/display" target="_blank" rel="noreferrer">打开现场二维码</a>
            <a class="button secondary" id="exportLink" href="/api/export">导出考勤汇总</a>
            <button class="button secondary" id="refreshDataBtn" type="button">刷新</button>
            <button class="button" id="logoutBtn" type="button">退出</button>
          </div>
        </section>

        <section data-panel="qr" class="grid two">
          <div class="panel qr-box">
            <h2>现场动态二维码</h2>
            <img id="qrImage" alt="动态签到二维码">
            <div class="countdown" aria-label="二维码刷新倒计时"><span id="countdownBar"></span></div>
            <p class="muted" id="qrCountdownText">正在生成二维码...</p>
            <button class="button secondary" id="copyLinkBtn" type="button">复制当前签到链接</button>
          </div>
          <div class="panel admin-summary">
            <h2>归档状态</h2>
            <dl class="definition-list">
              <div><dt>固定排班</dt><dd id="scheduleCount">0</dd></div>
              <div><dt>签到记录</dt><dd id="checkinCount">0</dd></div>
              <div><dt>数据存储</dt><dd id="storageMode">-</dd></div>
            </dl>
          </div>
        </section>

        <section data-panel="schedules" class="grid hidden">
          <div class="panel">
            <div class="section-heading">
              <h2>固定值班排班</h2>
              <span id="scheduleImportNotice" class="muted"></span>
            </div>
            <label for="schedulePaste">Excel 排班数据</label>
            <textarea id="schedulePaste" spellcheck="false" placeholder="中心	周次	星期	节次	值班人员	职位	联系电话"></textarea>
            <div class="toolbar" style="margin-top: 12px;">
              <button class="button" id="importSchedulesBtn" type="button">导入并覆盖固定排班</button>
            </div>
          </div>
          <div class="panel">
            <div class="section-heading">
              <h2>已归档排班</h2>
              <span id="scheduleTableCount" class="muted"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>中心</th><th>周次</th><th>星期</th><th>节次</th><th>姓名</th><th>职位</th><th>联系电话</th></tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section data-panel="review" class="grid hidden">
          <div class="grid four">
            <div class="metric"><span>固定排班</span><strong id="metricSchedules">0</strong></div>
            <div class="metric"><span>扫码记录</span><strong id="metricCheckins">0</strong></div>
            <div class="metric"><span>正常</span><strong id="metricNormal">0</strong></div>
            <div class="metric"><span>异常</span><strong id="metricAbnormal">0</strong></div>
          </div>
          <div id="reviewNotice" class="notice hidden"></div>
          <div class="panel">
            <div class="section-heading">
              <h2>排班与实际考勤</h2>
              <span class="muted" id="summaryTime"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>中心</th><th>周次</th><th>星期</th><th>节次</th><th>姓名</th><th>签到</th><th>签退</th><th>照片</th><th>考勤状态</th><th>备注</th><th></th>
                  </tr>
                </thead>
                <tbody id="reviewBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section data-panel="records" class="panel hidden">
          <div class="section-heading">
            <h2>原始签到签退记录</h2>
            <span class="muted" id="recordsCount"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>提交时间</th><th>姓名</th><th>中心</th><th>周次</th><th>星期</th><th>节次</th><th>值班类型</th><th>类别</th><th>照片</th>
                </tr>
              </thead>
              <tbody id="recordsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="/admin.js"></script>
  </body>
</html>
